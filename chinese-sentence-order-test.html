<!doctype html><html lang="zh-SG"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>句子排序 · 测试版</title><style>body{font-family:Arial,"Microsoft YaHei",sans-serif;background:#f4f7fc;color:#17243b;margin:0}header{background:#263e88;color:white;padding:18px 5%;font-size:24px;font-weight:bold}main{max-width:900px;margin:22px auto;padding:0 16px}.card{background:white;padding:22px;border-radius:18px;margin:16px 0;box-shadow:0 4px 20px #152f5414}textarea{width:100%;box-sizing:border-box;min-height:130px;font-size:20px;padding:12px;border:1px solid #bbc7dc;border-radius:10px}button{border:0;border-radius:10px;background:#315bea;color:white;padding:12px 17px;font-size:17px;cursor:pointer;margin:4px}button.secondary{background:#e9eefb;color:#263e88}.tile{background:#fff0bc;color:#473709;border:2px solid #dfc76e;font-size:23px;padding:15px}.zone{min-height:90px;border:2px dashed #a6b7d4;border-radius:12px;padding:12px;margin:12px 0;display:flex;gap:8px;flex-wrap:wrap;align-content:flex-start}.bank{background:#f2f5ff}.hint{color:#52617d}.hidden{display:none}.line{display:flex;gap:5px;flex-wrap:wrap;margin:14px 0}.piece{border:1px solid #b7c6de;border-radius:9px;padding:9px;background:#f6f8fd;font-size:21px}.break{cursor:pointer;border:0;background:#ccd4e4;width:7px;border-radius:4px;padding:0;margin:0 3px}.break.on{background:#2d60df}#msg{font-weight:bold;font-size:20px}footer{text-align:center;padding:25px;color:#64708a}</style><header>🧩 句子排序 · 独立测试版</header><main><section class="card" id="setup"><h2>教师设置</h2><p>输入正确的句子，每行一句。系统自动分词，教师可以调整分组，再生成排序练习。</p><textarea id="sentences">我和妈妈在公园里快乐地散步。\n今天下午我们一起去图书馆借书。</textarea><p><button id="prepare">自动分词与预览</button></p><p class="hint">也可用 / 手动指定分组，例如：我和妈妈 / 在公园里 / 快乐地散步。</p></section><section class="card hidden" id="preview"><h2>调整分组</h2><p class="hint">点击词语之间的竖线，切换合并或分开。每句均可独立调整。</p><div id="previews"></div><button id="generate">生成练习</button><button class="secondary" id="back">返回修改句子</button></section><section class="card hidden" id="play"><h2 id="progress"></h2><p>请把词语排成一个完整的句子。</p><h3>你的句子</h3><div class="zone" id="answer"></div><h3>词语库</h3><div class="zone bank" id="bank"></div><p id="msg"></p><button id="check">提交答案</button><button class="secondary" id="clear">清空</button><button class="secondary" id="speak">🔊 朗读</button><button class="secondary" id="next" hidden>下一题</button><button class="secondary" id="edit">教师设置</button></section></main><footer>Classroom Companion · 句子排序实验版 · 尚未整合到中文版</footer><script>
const $=id=>document.getElementById(id);let questions=[],idx=0,selected=[],remaining=[],score=0;
function strip(s){return s.replace(/[。！？!?]+$/g,'').trim()}
function segment(s){if(s.includes('/'))return s.split('/').map(x=>x.trim()).filter(Boolean);try{return [...new Intl.Segmenter('zh-SG',{granularity:'word'}).segment(s)].map(x=>x.segment).filter(x=>x.trim()&&!/^[，。！？、；：,.!?;:]$/.test(x))}catch(e){return [...s].filter(x=>!/^[，。！？、；：,.!?;:]$/.test(x))}}
function prepare(){const lines=$('sentences').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);questions=lines.map(line=>{let raw=strip(line),tokens=segment(raw),cuts=tokens.map((_,i)=>i<tokens.length-1);return {raw,tokens,cuts}}).filter(q=>q.tokens.length>1);if(!questions.length){alert('请输入至少一句可拆分的句子。');return}renderPreview();$('setup').classList.add('hidden');$('play').classList.add('hidden');$('preview').classList.remove('hidden')}
function groups(q){let a=[],cur='';q.tokens.forEach((w,i)=>{cur+=w;if(q.cuts[i]||i===q.tokens.length-1){a.push(cur);cur=''}});return a}
function renderPreview(){const root=$('previews');root.replaceChildren();questions.forEach((q,k)=>{let box=document.createElement('div');box.className='card';let h=document.createElement('h3');h.textContent=(k+1)+'. '+q.raw;box.append(h);let line=document.createElement('div');line.className='line';q.tokens.forEach((word,i)=>{let w=document.createElement('span');w.className='piece';w.textContent=word;line.append(w);if(i<q.tokens.length-1){let b=document.createElement('button');b.className='break'+(q.cuts[i]?' on':'');b.title='点击合并或分开';b.setAttribute('aria-label','切换词语分组');b.onclick=()=>{q.cuts[i]=!q.cuts[i];renderPreview()};line.append(b)}});box.append(line);let p=document.createElement('p');p.className='hint';p.textContent='排序卡片：'+groups(q).join(' ｜ ');box.append(p);root.append(box)})}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}if(b.length>1&&b.every((x,i)=>x===a[i]))[b[0],b[1]]=[b[1],b[0]];return b}
function start(){questions=questions.filter(q=>groups(q).length>1);if(!questions.length){alert('每句至少需要两个排序卡片。');return}idx=0;score=0;$('preview').classList.add('hidden');$('play').classList.remove('hidden');render()}
function render(){selected=[];remaining=shuffle(groups(questions[idx]).map((text,i)=>({text,id:i})));$('progress').textContent='第 '+(idx+1)+' / '+questions.length+' 题 · 得分 '+score;$('msg').textContent='';$('next').hidden=true;$('check').disabled=false;draw()}
function draw(){for(const [id,data] of [['answer',selected],['bank',remaining]]){const box=$(id);box.replaceChildren();data.forEach((obj,i)=>{let b=document.createElement('button');b.className='tile';b.textContent=obj.text;b.onclick=()=>{data.splice(i,1);(id==='answer'?remaining:selected).push(obj);$('msg').textContent='';draw()};box.append(b)})}}
function check(){let target=groups(questions[idx]);if(selected.length!==target.length){$('msg').textContent='请先排好所有词语。';return}if(selected.every((v,i)=>v.id===i)){$('msg').textContent='✓ 答对了！';score++;$('check').disabled=true;$('next').hidden=false;speak(questions[idx].raw)}else $('msg').textContent='再试一次！'}
function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.85;let voices=speechSynthesis.getVoices(),v=voices.find(v=>/zh-(CN|SG)/i.test(v.lang)&&/female|xiaoxiao|google/i.test(v.name))||voices.find(v=>/^zh/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}
$('prepare').onclick=prepare;$('generate').onclick=start;$('back').onclick=()=>{$('preview').classList.add('hidden');$('setup').classList.remove('hidden')};$('check').onclick=check;$('clear').onclick=()=>{remaining.push(...selected);selected=[];$('msg').textContent='';draw()};$('speak').onclick=()=>speak(selected.map(x=>x.text).join(''));$('next').onclick=()=>{idx++;if(idx>=questions.length){$('msg').textContent='完成！总得分：'+score+'/'+questions.length;$('next').hidden=true;$('check').disabled=true}else render()};$('edit').onclick=()=>{$('play').classList.add('hidden');$('setup').classList.remove('hidden')};
</script></html>
